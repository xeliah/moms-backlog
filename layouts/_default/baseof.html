<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.tagline }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.positioning }}{{ else }}{{ .Summary }}{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <div class="site-frame">
    <header class="site-header">
      <a class="brand" href="{{ "" | relURL }}">
        <span class="brand-mark">MB</span>
        <span class="brand-name">Mom's Backlog</span>
      </a>
      <nav class="site-nav">
        <a href="{{ "" | relURL }}#backlog">Backlog</a>
<a href="{{ "about/" | relURL }}">About</a>
      </nav>
    </header>

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="site-footer">
      <div class="footer-line"></div>
      <p>Mom's Backlog — product management applied to raising a strong-willed kid. Written by a PM, a mom, one ticket at a time.</p>
    </footer>
  </div>
</body>
</html>
